<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Your Phone Ringing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="screen">
  <img id="backdrop" src="art/bathroom.svg" alt="">
  <div id="vignette"></div>
  <div id="noise"></div>
  <div id="flash"></div>
  <header id="header">
    <div class="logotype">YOUR PHONE <span>RINGING</span><small>OFFLINE / DIRECT SIGNAL</small></div>
    <div id="score"></div>
  </header>
  <div id="portrait"><img id="face" src="art/face.svg" alt="Opponent"></div>
  <div id="lifelines"></div>
  <div id="phones"></div>
  <div id="projectile"><img src="art/phone.svg" alt=""></div>
  <main id="dialogue">
    <div id="subtitle">INCOMING CALL · UNKNOWN</div>
    <h1 id="heading">YOUR PHONE RINGING</h1>
    <p id="story">加载中……</p>
    <div id="entry"></div>
    <div id="actions"></div>
    <div class="footer"><span id="status">NO SIGNAL</span><span>▣ FIN-AL60 / ARM64</span></div>
  </main>
</div>
<script src="game.js"></script>
</body>
</html>
