name: Build and publish ArmorFront CC0 demo APK
on:
  workflow_dispatch:
  push:
    branches: [armor-front-public-demo]
    paths:
      - 'armor-front/**'
      - '.github/workflows/armor-front-public.yml'
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: armor-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Blender conversion dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq blender python3-numpy
      - name: Fetch original distinct CC0 tank models
        run: |
          set -euo pipefail
          mkdir -p originals app/src/main/assets/assets/models
          curl -fL --retry 3 --max-time 120 'https://opengameart.org/sites/default/files/Rudy.blend' -o originals/t34.blend
          curl -fL --retry 3 --max-time 120 'https://opengameart.org/sites/default/files/pzIIIs.blend' -o originals/panzer3.blend
          curl -fL --retry 3 --max-time 120 'https://opengameart.org/sites/default/files/abrams-tank.blend' -o originals/abrams.blend
      - name: Convert and verify all three distinct vehicle GLBs
        run: |
          set -euo pipefail
          blender -b --python-exit-code 9 -P scripts/export_model.py -- originals/t34.blend app/src/main/assets/assets/models/t34_85.glb
          blender -b --python-exit-code 9 -P scripts/export_model.py -- originals/panzer3.blend app/src/main/assets/assets/models/panzer_iii.glb
          blender -b --python-exit-code 9 -P scripts/export_model.py -- originals/abrams.blend app/src/main/assets/assets/models/abrams_freeciv.glb
          python3 scripts/inject_manifest.py
          test $(find app/src/main/assets/assets/models -name '*.glb' | wc -l) -eq 3
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Android debug APK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/assets/models/t34_85.glb'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/assets/models/panzer_iii.glb'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/assets/models/abrams_freeciv.glb'
      - uses: actions/upload-artifact@v4
        with:
          name: ArmorFront-3-CC0-Models-APK
          path: armor-front/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Put APK on public branch
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ../ArmorFront-Demo.apk
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ArmorFront-Demo.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Publish ArmorFront 3-vehicle APK [skip ci]'
            git push origin HEAD:armor-front-public-demo
          fi
